upstream django {
    server backend:8000;
}

server {
  listen 80;
  index index.html;

  location / {
      root /var/www/app;
      try_files $uri $uri/ /index.html;
  }

  location /media/ {
    root /var/www/media;
  }

  location /static/js/ {
    root /var/www/app/;
  }

  location /static/css/ {
    root /var/www/app/;
  }

  location /static/media/ {
    root /var/www/app/;
  }

  location /static/ {
    root /var/www/;
  }

  location ~ ^/(api|admin) {
      proxy_pass http://django;
  }
}
